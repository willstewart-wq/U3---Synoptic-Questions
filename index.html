<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCR Level 3 Sport - Unit 3 Synoptic Revision Guide</title>
  <style>
    :root {
      --primary: #003366;
      --primary-accent: #0056b3;
      --secondary: #f4f7f6;
      --text: #222222;
      --card-bg: #ffffff;
      --border: #dcdcdc;
      --success: #28a745;
      --warning: #ffc107;
      --danger: #dc3545;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #eef2f5;
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    header {
      background: var(--primary);
      color: white;
      padding: 25px 20px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    header h1 {
      font-size: 1.8rem;
      margin-bottom: 5px;
    }

    header p {
      font-size: 0.95rem;
      opacity: 0.9;
    }

    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border: 1px solid var(--border);
    }

    .user-info-card {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
      background: #ffffff;
      border-left: 5px solid var(--primary);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 200px;
    }

    .input-group label {
      font-weight: bold;
      font-size: 0.85rem;
      margin-bottom: 4px;
      color: #555;
    }

    .input-group input {
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 5px;
      font-size: 1rem;
    }

    .actions-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 25px;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-accent); }

    .btn-success { background: var(--success); color: white; }
    .btn-success:hover { background: #218838; }

    .btn-secondary { background: #6c757d; color: white; }
    .btn-secondary:hover { background: #5a6268; }

    .btn-doc { background: #0f9d58; color: white; }
    .btn-doc:hover { background: #0b8043; }

    .save-status {
      font-size: 0.85rem;
      color: #666;
      font-style: italic;
    }

    .question-card {
      position: relative;
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      border-bottom: 2px solid #f0f0f0;
      padding-bottom: 8px;
    }

    .question-title {
      font-weight: 700;
      color: var(--primary);
      font-size: 1.1rem;
    }

    .question-marks {
      background: #e9ecef;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 0.85rem;
      color: #495057;
    }

    .question-text {
      margin-bottom: 15px;
      font-size: 1rem;
      white-space: pre-line;
    }

    .answer-box {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 5px;
      font-size: 0.95rem;
      font-family: inherit;
      resize: vertical;
      min-height: 80px;
      margin-bottom: 8px;
    }

    .answer-box:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 5px rgba(0,51,102,0.2);
    }

    .list-inputs {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }

    .list-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .list-item span {
      font-weight: bold;
      color: #666;
    }

    .list-item input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 5px;
      font-size: 0.95rem;
    }

    .radio-group {
      display: flex;
      gap: 20px;
      margin: 10px 0;
    }

    .radio-option {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .feedback-box {
      margin-top: 15px;
      padding: 12px 15px;
      border-radius: 6px;
      display: none;
    }

    .feedback-box.show {
      display: block;
    }

    .feedback-box.attempted {
      background-color: #f8f9fa;
      border-left: 4px solid var(--primary);
    }

    .feedback-box.unattempted {
      background-color: #fff3cd;
      border-left: 4px solid var(--warning);
      color: #856404;
    }

    .score-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: bold;
      color: white;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .score-badge.high { background-color: var(--success); }
    .score-badge.med { background-color: var(--warning); color: #333; }
    .score-badge.low { background-color: var(--danger); }

    .model-answer {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #ccc;
      font-size: 0.9rem;
    }

    .model-answer h5 {
      color: var(--primary);
      margin-bottom: 4px;
    }

    .model-answer ul {
      margin-left: 20px;
    }

    .results-card {
      text-align: center;
      background: #ffffff;
      border: 2px solid var(--primary);
      display: none;
    }

    .results-card.show {
      display: block;
    }

    .total-score {
      font-size: 2.5rem;
      font-weight: bold;
      color: var(--primary);
      margin: 10px 0;
    }

    .hidden-file-input {
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>OCR Level 3 Sport & Physical Activity</h1>
    <p>Unit 3 Synoptic Revision Guide - Interactive Worksheet</p>
  </header>

  <div class="container">
    
    <!-- Student Info Card -->
    <div class="card user-info-card">

      <div class="input-group">

      </div>
    </div>

    <!-- Actions Bar -->
    <div class="actions-bar">
      <div class="btn-group">
        <button class="btn-primary" onclick="saveToLocalStorage()">💾 Save Progress</button>
        <button class="btn-secondary" onclick="exportJSON()">📥 Export JSON</button>
        <button class="btn-secondary" onclick="document.getElementById('importFileInput').click()">📤 Load JSON</button>
        <input type="file" id="importFileInput" class="hidden-file-input" accept=".json" onchange="importJSON(event)">
        <button class="btn-doc" onclick="exportGoogleDoc()">📄 Export as Google Doc</button>
      </div>
      <button class="btn-success" onclick="markAllQuestions()">✔ Mark My Work</button>
      <span class="save-status" id="saveStatus">Auto-saved to browser</span>
    </div>

    <!-- Overall Results Summary -->
    <div class="card results-card" id="resultsSummary">

      <div class="total-score" id="totalScoreDisplay">0 / 66</div>
      <p id="gradeFeedback"></p>
    </div>

    <!-- Questions Container -->
    <div id="questionsContainer"></div>

  </div>
